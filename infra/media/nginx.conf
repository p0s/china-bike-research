worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;
  sendfile on;
  etag on;
  limit_req_zone $binary_remote_addr zone=media_requests:10m rate=30r/s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /health.json {
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files /health.json =404;
    }

    location ~ "^/media/xhs/[a-z0-9][a-z0-9-]*/[a-f0-9]{16}-(?:card|detail)-w[0-9]+\.webp$" {
      limit_req zone=media_requests burst=60 nodelay;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header Cross-Origin-Resource-Policy "cross-origin" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Robots-Tag "noindex, noimageindex" always;
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location / {
      return 404;
    }
  }
}
