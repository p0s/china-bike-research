name: Account ID guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  account-id-guard:
    runs-on: ubuntu-latest
    steps:
      # This workflow runs from the protected base branch. Fetch PR Git objects
      # as data only; never execute files or package scripts from the PR head.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch proposed commits as data
        run: git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/account-id-guard-head"
      - name: Check every proposed commit using the base-branch scanner
        run: node scripts/check-outgoing-privacy.mjs "${{ github.event.pull_request.base.sha }}" refs/remotes/origin/account-id-guard-head
