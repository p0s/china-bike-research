name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Restore this publisher's public IndexNow state from its preceding run.

concurrency:
  group: cloudflare-production
  # Finish live verification/notification before the next publisher snapshots it.
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the dedicated deployment credential is configured.
    # Local Wrangler remains the documented deployment path until then.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm run check
      - name: Locate saved IndexNow delivery state
        id: indexnow-state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/indexnow-artifact.mjs --output "$GITHUB_OUTPUT"
      - name: Restore IndexNow delivery state
        id: indexnow-restore
        if: steps.indexnow-state.outcome == 'success' && steps.indexnow-state.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: indexnow-delivery-state-v1
          path: ${{ runner.temp }}/indexnow-state
          run-id: ${{ steps.indexnow-state.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Snapshot IndexNow delivery state
        id: indexnow-snapshot
        if: steps.indexnow-state.outcome == 'success' && (steps.indexnow-restore.outcome == 'success' || steps.indexnow-restore.outcome == 'skipped')
        continue-on-error: true
        run: node scripts/indexnow.mjs snapshot --output "$RUNNER_TEMP/indexnow-before.json" --state "$RUNNER_TEMP/indexnow-state/state.json"
      - name: Deploy Worker and Static Assets
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.135.0'
          command: deploy
      - name: Notify IndexNow of deployed public page changes
        if: steps.deploy.outcome == 'success' && steps.indexnow-snapshot.outcome == 'success'
        continue-on-error: true
        run: node scripts/indexnow.mjs notify --before "$RUNNER_TEMP/indexnow-before.json" --expected dist/indexnow-manifest.json --state "$RUNNER_TEMP/indexnow-state/state.json"
      - name: Save IndexNow delivery state
        if: always() && steps.indexnow-snapshot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-delivery-state-v1
          path: ${{ runner.temp }}/indexnow-state/state.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true # A rerun restores this run's last acknowledgement before replacing its state.
