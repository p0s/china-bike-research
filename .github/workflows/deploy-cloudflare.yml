name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  # Finish live verification/notification before the next publisher snapshots it.
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the dedicated deployment credential is configured.
    # Local Wrangler remains the documented deployment path until then.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate and build
        run: npm run check
      - name: Snapshot public pages before deployment
        continue-on-error: true
        run: node scripts/indexnow.mjs snapshot --output "$RUNNER_TEMP/indexnow-before.json"
      - name: Deploy Worker and Static Assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.135.0'
          command: deploy
      - name: Notify IndexNow of deployed public page changes
        continue-on-error: true
        run: node scripts/indexnow.mjs notify --before "$RUNNER_TEMP/indexnow-before.json" --expected dist/indexnow-manifest.json
