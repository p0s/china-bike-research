name: Data freshness report

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 1 * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate report
        run: npm run stale:report -- --output stale-report.md
      - name: Add report to workflow summary
        run: cat stale-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: data-freshness-report
          path: stale-report.md
