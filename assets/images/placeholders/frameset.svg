<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Frameset image placeholder</title>
  <desc id="desc">Original line illustration used when a verified frameset photograph is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4eb"/>
      <stop offset="1" stop-color="#dce9d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#193227" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <circle cx="1040" cy="125" r="175" fill="none" stroke="#b7f36b" stroke-width="58" opacity=".45"/>
  <g filter="url(#shadow)" fill="none" stroke="#17352b" stroke-linecap="round" stroke-linejoin="round">
    <path d="M365 532 527 285 685 532H365Zm162-247 246 36-88 211M365 532l320 0" stroke-width="34"/>
    <path d="M773 321 887 545m-114-224 45-105m-31-5h112" stroke-width="30"/>
    <path d="M527 285l-25-91m-57 0h112" stroke-width="26"/>
    <circle cx="685" cy="532" r="41" stroke-width="20"/>
    <path d="M685 532 622 608m63-76 64 76" stroke-width="16"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="710" fill="#17352b" font-size="38" font-weight="800">Frameset image not yet verified</text>
    <text x="600" y="754" fill="#577064" font-size="24">A source-labelled photo can be added through GitHub</text>
  </g>
</svg>
