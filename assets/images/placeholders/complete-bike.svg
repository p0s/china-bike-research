<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Complete bike image placeholder</title>
  <desc id="desc">Original line illustration used when a verified product photograph is unavailable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4eb"/>
      <stop offset="1" stop-color="#dce9d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#193227" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="42" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="175" fill="none" stroke="#b7f36b" stroke-width="58" opacity=".45"/>
  <g filter="url(#shadow)" fill="none" stroke="#17352b" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="330" cy="505" r="154" stroke-width="20"/>
    <circle cx="874" cy="505" r="154" stroke-width="20"/>
    <path d="M330 505 498 294 640 505H330Zm168-211 227 30 149 181M640 505l85-181M498 294l-30-82m-57 0h112m202 112 42-80m-23-6h88" stroke-width="25"/>
    <path d="M640 505h234" stroke-width="18" opacity=".55"/>
    <circle cx="640" cy="505" r="35" stroke-width="17"/>
    <path d="M640 505 583 578m57-73 59 71" stroke-width="15"/>
  </g>
  <g font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" text-anchor="middle">
    <text x="600" y="710" fill="#17352b" font-size="38" font-weight="800">Product image not yet verified</text>
    <text x="600" y="754" fill="#577064" font-size="24">A source-labelled photo can be added through GitHub</text>
  </g>
</svg>
